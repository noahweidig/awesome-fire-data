- id: mtbs
  title: MTBS (Monitoring Trends in Burn Severity)
  icon: lucide/layers
  summary: Burn severity mosaics and perimeters for large US fires, mapped from Landsat.
  provider: USGS EROS and USDA Forest Service
  coverage: CONUS, Alaska, Hawaii, Puerto Rico
  period: 1984 to present
  resolution: 30 m
  format: [GeoTIFF, Shapefile]
  license: Public domain
  update: Annual
  access: https://www.mtbs.gov/direct-download
  docs: https://www.mtbs.gov/
  tags: [United States, Bulk download, GeoTIFF, Shapefile, Public domain, Annual, 30 m]
  caveat: Covers fires of at least 1,000 acres in the West and 500 acres in the East. Includes prescribed fire perimeters. See Prescribed fire & fuel treatments for other prescribed burn sources.
  related: [se-firemap, facts-hazardous-fuels]
- id: wfigs-perimeters
  title: WFIGS Interagency Fire Perimeters
  icon: lucide/map
  summary: Current and historical wildland fire perimeters from US interagency sources.
  provider: NIFC (National Interagency Fire Center)
  coverage: United States
  period: Current year and historical archive
  resolution: Vector
  format: [ArcGIS feature service, GeoJSON, Shapefile]
  license: Public domain
  update: Continuous
  access: https://data-nifc.opendata.arcgis.com/
  docs: https://data-nifc.opendata.arcgis.com/
  tags: [United States, API, GeoJSON, Shapefile, Public domain, Near real time]
  related: [mtbs, fireline-engagement]
- id: mcd64a1
  title: MODIS MCD64A1 Burned Area
  icon: lucide/satellite
  summary: Global monthly burned-area product with burn date, from MODIS surface reflectance.
  provider: NASA LP DAAC
  coverage: Global
  period: 2000 to present
  resolution: 500 m
  format: [HDF4, GeoTIFF]
  license: NASA open data
  update: Monthly
  access: https://www.earthdata.nasa.gov/data/catalog/lpcloud-mcd64a1-061
  docs: https://www.earthdata.nasa.gov/data/catalog/lpcloud-mcd64a1-061
  tags: [Global, Bulk download, API, HDF, NASA open data, Monthly, 500 m]
- id: cnfdb
  title: Canadian National Fire Database (CNFDB)
  icon: lucide/map
  summary: Fire perimeters and point locations reported by Canadian agencies.
  provider: Canadian Forest Service (NRCan)
  coverage: Canada
  period: 1917 to present
  resolution: Vector
  format: [Shapefile]
  license: Open Government Licence - Canada
  update: Annual
  access: https://cwfis.cfs.nrcan.gc.ca/datamart
  docs: https://cwfis.cfs.nrcan.gc.ca/
  tags: [Canada, Bulk download, Shapefile, Open Government Licence, Annual]
- id: globfire
  title: GlobFire
  icon: lucide/globe
  summary: Global fire event polygons with daily progression, built from MODIS MCD64A1 burned area.
  provider: JRC Global Wildfire Information System
  coverage: Global
  period: 2001 to 2020
  resolution: Event polygons (from 500 m MODIS)
  format: [Shapefile]
  license: CC BY 4.0
  update: Static
  access: https://developers.google.com/earth-engine/datasets/catalog/JRC_GWIS_GlobFire_v2_FinalPerimeters
  docs: https://doi.org/10.1038/s41597-019-0312-2
  tags: [Global, Bulk download, Shapefile, CC BY 4.0, Static]
  related: [mcd64a1, fired]
  caveat: Based on 500 m MODIS, so small fires are missed. A GWIS download page also exists.
- id: fire-cci51
  title: ESA Fire_cci MODIS Burned Area (v5.1)
  icon: lucide/satellite
  summary: Global burned area pixel product with date of burn and confidence, from MODIS.
  provider: ESA Climate Change Initiative
  coverage: Global
  period: 2001 to 2020
  resolution: 250 m
  format: [NetCDF]
  license: ESA CCI data policy
  update: Static
  access: https://catalogue.ceda.ac.uk/uuid/58f00d8814064b79a0c49662ad3af537
  docs: https://climate.esa.int/en/projects/fire/
  tags: [Global, Bulk download, NetCDF, Static, 250 m]
  related: [mcd64a1]
  caveat: Also available as an Earth Engine collection. Newer Fire_cci products exist, so check the project page.
- id: gabam
  title: GABAM Global Annual Burned Area Map
  icon: lucide/layers
  summary: 30 m annual burned area from Landsat for the globe, built in Google Earth Engine.
  provider: Aerospace Information Research Institute, Chinese Academy of Sciences
  coverage: Global
  period: Varies by release (2014 to 2024 in the latest Zenodo record)
  resolution: 30 m
  format: [GeoTIFF]
  license: See Zenodo record
  update: Annual
  access: https://zenodo.org/records/17707433
  docs: https://doi.org/10.3390/rs11050489
  tags: [Global, Bulk download, GeoTIFF, Annual, 30 m]
  related: [mcd64a1]
  caveat: Year ranges differ between releases. Confirm coverage on the Zenodo record before use.
