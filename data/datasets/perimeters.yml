  provider: Canadian Forest Service (NRCan) with provincial, territorial and Parks Canada agencies
  coverage: Canada
  period: 1972 to 2024
  resolution: Vector
  format: [Shapefile]
  license: Free with attribution (see CWFIS Datamart)
  update: Annual
  access: https://cwfis.cfs.nrcan.gc.ca/datamart/download/nbac
  docs: https://cwfis.cfs.nrcan.gc.ca/datamart/metadata/nbac
  tags: [Canada, Bulk download, Shapefile, Annual, Free with attribution, Vector, Fire perimeters, Burned area]
