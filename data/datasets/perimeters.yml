- id: mcd64a1
  title: MODIS MCD64A1 Burned Area
  icon: lucide/satellite
  summary: Global monthly burned-area product with burn date, from MODIS surface reflectance.
  provider: NASA LP DAAC
  coverage: Global
  period: 2000 to present
  resolution: 500 m
  format: [HDF4, GeoTIFF]
  license: NASA open data
  update: Monthly
  access: https://www.earthdata.nasa.gov/data/catalog/lpcloud-mcd64a1-061
  docs: https://www.earthdata.nasa.gov/data/catalog/lpcloud-mcd64a1-061
  tags: [Global, Bulk download, API, HDF, NASA open data, Monthly, 500 m, Monthly steps, GeoTIFF, MODIS, Burned area]
  caveat: NASA plans to stop Terra MODIS science data collection in February 2027 and Aqua in September 2027 (LAADS DAAC). Earthdata describes shutdown as beginning in late 2026 to early 2027, with both orbits drifting. VNP64A1 is the VIIRS continuity product, but see its caveat on S-NPP.
  related: [vnp64a1, fire-cci51]
  verified: '2026-11-12'
