- id: landsat-burned-area
  title: USGS Landsat Burned Area (Collection 2 Level-3)
  icon: lucide/flame
  summary: Scene-level burn classification and burn probability rasters from Landsat 4 to 9.
  provider: USGS EROS
  coverage: Conterminous US
  period: 1984 to present
  resolution: 30 m
  format: [GeoTIFF]
  license: Public domain
  update: Ongoing; latest data release v5.0 (April 2026)
  access: https://www.usgs.gov/landsat-missions/landsat-collection-2-level-3-burned-area-science-product
  docs: https://www.usgs.gov/centers/eros/science/usgs-eros-archive-landsat-collection-2-level-3-burned-area-ba-science-product
  tags: [United States, Bulk download, GeoTIFF, Public domain, 30 m, Ongoing, Landsat, Burned area]
  caveat: 'Acquisition-based products: each scene gets a burn classification and probability, not a fire perimeter. Order through EarthExplorer. The April 2026 data release (v5.0) covers the conterminous US. Collection 2 ARD exists for Alaska, but I found no Alaska burned-area product.'
  related: [mtbs, se-firemap]
  verified: '2026-11-12'
- id: nbac
  title: NBAC (National Burned Area Composite)
  icon: lucide/layers
