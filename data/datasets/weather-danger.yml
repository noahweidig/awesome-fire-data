- id: gridmet
  title: gridMET
  icon: lucide/thermometer-sun
  summary: Daily gridded surface meteorology, fuel moisture and fire danger indices for the contiguous US.
  provider: University of Idaho / Climatology Lab
  coverage: CONUS
  period: 1979 to present
  resolution: 4 km
  format: [NetCDF]
  license: Public domain
  update: Daily
  access: https://www.climatologylab.org/gridmet.html
  docs: https://www.climatologylab.org/gridmet.html
  tags: [United States, API, Bulk download, NetCDF, Public domain, Daily, 4 km]
  snippets:
    - label: Earth Engine (Python)
      lang: python
      code: |
        import ee
        ee.Initialize()
        erc = ee.ImageCollection("IDAHO_EPSCOR/GRIDMET").filterDate("2024-07-01", "2024-07-08").select("erc")
- id: daymet
  title: Daymet
  icon: lucide/cloud-rain
  summary: Daily 1 km gridded surface weather (temperature, precipitation, radiation, humidity, snow water equivalent) for North America.
  provider: NASA ORNL DAAC
  coverage: North America
  period: 1980 to present
  resolution: 1 km
  format: [NetCDF]
  license: NASA open data
  update: Annual
  access: https://daymet.ornl.gov/getdata
  docs: https://daymet.ornl.gov/overview
  tags: [North America, API, Bulk download, NetCDF, NASA open data, Daily, 1 km]
  caveat: Covers weather variables only. Fire danger indices must be derived.
- id: cems-fire-historical
  title: CEMS Fire Danger Indices (ERA5-based)
  icon: lucide/cloud-sun
  summary: Global daily fire danger indices, including the Canadian Fire Weather Index, from ERA5 reanalysis.
  provider: Copernicus Emergency Management Service
  coverage: Global
  period: 1940 to present
  resolution: 0.25 degrees
  format: [GRIB, NetCDF]
  license: Copernicus licence
  update: Daily
  access: https://ewds.climate.copernicus.eu/datasets/cems-fire-historical-v1
  docs: https://ewds.climate.copernicus.eu/datasets/cems-fire-historical-v1
  tags: [Global, API, NetCDF, GRIB, Copernicus licence, Daily]
- id: cwfis
  title: CWFIS (Canadian Wildland Fire Information System)
  icon: lucide/compass
  summary: Daily Fire Weather Index maps, hotspots, and downloadable fire weather and danger data for Canada.
  provider: Canadian Forest Service (NRCan)
  coverage: Canada
  period: Current and archive
  resolution: 2.5 km to 10 km
  format: [GeoTIFF, Shapefile, CSV]
  license: Open Government Licence - Canada
  update: Daily
  access: https://cwfis.cfs.nrcan.gc.ca/datamart
  docs: https://cwfis.cfs.nrcan.gc.ca/
  tags: [Canada, Bulk download, GeoTIFF, CSV, Open Government Licence, Daily]
- id: wfas
  title: WFAS (Wildland Fire Assessment System)
  icon: lucide/thermometer-sun
  summary: National fire danger, fuel moisture and weather maps and forecasts from the USDA Forest Service.
  provider: USDA Forest Service
  coverage: United States
  period: Current and recent
  resolution: Varies
  format: [Maps, GIS data]
  license: Public domain
  update: Daily
  access: https://www.wfas.net/
  docs: https://www.wfas.net/
  tags: [United States, Maps, Public domain, Daily]
- id: prism
  title: PRISM Climate Data
  icon: lucide/thermometer
  summary: Daily and monthly gridded temperature, precipitation and dew point for the conterminous US.
  provider: PRISM Climate Group, Oregon State University
  coverage: Conterminous US
  period: 1981 to present
  resolution: 4 km
  format: [BIL]
  license: PRISM terms of use
  update: Daily
  access: https://prism.oregonstate.edu/downloads/
  docs: https://prism.oregonstate.edu/
  tags: [United States, Bulk download, Custom terms, Daily, 4 km]
  related: [gridmet, daymet]
- id: era5-land
  title: ERA5-Land
  icon: lucide/cloud-sun
  summary: Hourly global land surface reanalysis of temperature, soil moisture, wind, radiation and precipitation.
  provider: ECMWF, Copernicus Climate Change Service
  coverage: Global
  period: 1950 to present
  resolution: 0.1 degrees
  format: [GRIB, NetCDF]
  license: Copernicus licence
  update: Daily
  access: https://cds.climate.copernicus.eu/datasets/reanalysis-era5-land
  docs: https://cds.climate.copernicus.eu/datasets/reanalysis-era5-land
  tags: [Global, API, GRIB, NetCDF, Copernicus licence, Hourly]
  related: [cems-fire-historical]
  caveat: Needs a free Copernicus account and API key.
- id: hrrr
  title: HRRR (High-Resolution Rapid Refresh)
  icon: lucide/cloud-lightning
  summary: Hourly 3 km convection-allowing weather analyses and forecasts, including wind, humidity and temperature.
  provider: NOAA NCEP and ESRL/GSL
  coverage: Conterminous US and Alaska
  period: 2014 to present (AWS archive)
  resolution: 3 km
  format: [GRIB]
  license: Public domain
  update: Hourly
  access: https://registry.opendata.aws/noaa-hrrr-pds/
  docs: https://rapidrefresh.noaa.gov/hrrr/
  tags: [United States, Cloud bucket, GRIB, Public domain, Hourly, 3 km]
  related: [hrrr-smoke, gridmet]
  caveat: "The Herbie Python package simplifies retrieval of individual fields. NOAA says HRRR is not retired with the RRFS v1 implementation. A retirement date has not been announced."
  verified: "2026-11-09"
  snippets:
    - label: Python
      lang: python
      code: |
        from herbie import Herbie
        H = Herbie("2024-07-01 12:00", model="hrrr", product="sfc", fxx=0)
        ds = H.xarray("TMP:2 m")
- id: us-drought-monitor
  title: US Drought Monitor
  icon: lucide/sun
  summary: Weekly drought category maps for the US, with polygon, grid and statistics downloads.
  provider: National Drought Mitigation Center (University of Nebraska-Lincoln), USDA and NOAA
  coverage: United States
  period: 2000 to present
  resolution: Vector (500 m grid also offered)
  format: [Shapefile, KMZ, GML, GeoJSON, WMS]
  license: See NDMC terms
  update: Weekly
  access: https://droughtmonitor.unl.edu/DmData/GISData.aspx
  docs: https://droughtmonitor.unl.edu/
  tags: [United States, API, Bulk download, Shapefile, GeoJSON, Weekly]
  related: [gridmet, wfas]
  caveat: NDMC says its shapefiles were modified from the originals. Use a vector dataset to match official statistics. Community GeoParquet mirrors exist.
  verified: "2026-11-09"
- id: raws
  title: RAWS (Remote Automatic Weather Stations)
  icon: lucide/thermometer-sun
  summary: Hourly fire weather observations from interagency stations, archived by the Western Regional Climate Center.
  provider: Western Regional Climate Center (Desert Research Institute) for NWCG agencies
  coverage: United States
  period: Varies by station
  resolution: Station
  format: [Tabular web download]
  license: See WRCC terms
  update: Continuous
  access: https://raws.dri.edu/
  docs: https://raws.dri.edu/
  tags: [United States, Tabular, Continuous]
  related: [gridmet, wfas]
  caveat: Public data are not quality controlled. A 2025 mailing-list post quoting WRCC says raw public access is limited to the prior 30 days, with older data on request and possibly for a fee. I could not confirm that on an official page. The R package RAWSmet downloads and parses WRCC data.
  verified: "2026-11-09"
