- id: firms
  title: NASA FIRMS (Fire Information for Resource Management System)
  icon: lucide/satellite
  summary: Near-real-time active fire detections from MODIS and VIIRS, with map, download and API access.
  provider: NASA
  coverage: Global
  period: 2000 to present (MODIS), 2012 to present (VIIRS)
  resolution: 375 m to 1 km
  format: [CSV, Shapefile, GeoJSON, KML]
  license: NASA open data
  update: Near real time
  access: https://firms.modaps.eosdis.nasa.gov/active_fire/
  docs: https://firms.modaps.eosdis.nasa.gov/
  tags: [Global, API, Bulk download, CSV, Shapefile, NASA open data, Near real time, 375 m, GeoJSON, KML, MODIS, VIIRS, Active fire]
  caveat: MODIS detections depend on Terra and Aqua. NASA plans to stop Terra MODIS science data collection in February 2027 and Aqua in September 2027 (LAADS DAAC). VIIRS detections continue.
  verified: '2026-11-12'
- id: goes-fdc
  title: GOES-R Fire/Hot Spot Characterization on AWS
  icon: lucide/satellite
  summary: Geostationary fire detection with fire power and temperature, updated every 5 to 15 minutes.
  provider: NOAA / NESDIS
  coverage: Americas
  period: 2017 to present
  resolution: 2 km
  format: [NetCDF]
  license: Public domain
  update: 5 to 15 minutes
  access: https://registry.opendata.aws/noaa-goes/
  docs: https://www.nesdis.noaa.gov/our-satellites/currently-flying/goes-east-west/goes-r-series-data-products
  tags: [Americas, Cloud bucket, NetCDF, Public domain, Near real time, 2 km, GOES, Active fire]
  caveat: GOES-19 operational data production began April 7, 2025, and earlier GOES-19 data are provisional. NOAA advises users with low false-alarm tolerance to use mask codes 10, 11, 30 and 31.
  verified: '2026-11-12'
- id: noaa-hms
  title: NOAA Hazard Mapping System (HMS) Fire and Smoke
  icon: lucide/wind
  summary: Analyst-reviewed fire detections and smoke plume polygons for North America.
  provider: NOAA OSPO
  coverage: North America
  period: 2003 to present
  resolution: Vector
  format: [Shapefile, KML, GIS data]
  license: Public domain
  update: Daily
  access: https://www.ospo.noaa.gov/products/land/hms.html
  docs: https://www.ospo.noaa.gov/products/land/hms.html
  tags: [North America, Bulk download, Shapefile, KML, Public domain, Daily, Vector, Active fire, Smoke]
