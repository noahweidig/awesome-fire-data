- id: rx-permits-ga-fl
  title: Prescribed Fire Permit Records for Georgia and Florida
  icon: lucide/file-check
  summary: Permit records for prescribed burns in Georgia and Florida with weather conditions on permitted days.
  provider: USGS
  coverage: Georgia and Florida
  period: 2006 to 2016
  resolution: Permit records
  format: [CSV, Shapefile]
  license: Public domain
  update: Static
  access: https://doi.org/10.5066/P9YNSQZ2
  docs: https://doi.org/10.5066/P9YNSQZ2
  tags: [United States, Bulk download, CSV, Shapefile, Public domain, Static, Point or station, Prescribed fire]
  related: [se-firemap]
  caveat: Tall Timbers maintains a larger 12-state permit database (2010 to 2020) that is not publicly downloadable.
- id: facts-hazardous-fuels
  title: USFS Hazardous Fuel Treatment Reduction (FACTS)
  icon: lucide/trees
  summary: Polygon and line records of Forest Service hazardous fuel treatments, including prescribed burning, from the FACTS activity tracking system.
  provider: USDA Forest Service
  coverage: United States (Forest Service activities)
  period: Ongoing
  resolution: Polygons and lines
  format: [GeoDatabase, Shapefile, GeoJSON, KML, CSV]
  license: CC BY 4.0
  update: Ongoing
  access: https://data.fs.usda.gov/geodata/edw/datasets.php
  docs: https://catalog.data.gov/dataset/hazardous-fuel-treatment-reduction-polygon-feature-layer
  tags: [United States, API, Bulk download, GeoDatabase, Shapefile, GeoJSON, KML, CSV, CC BY 4.0, Ongoing, Vector, Prescribed fire, Fuels]
  related: [mtbs, wfigs-perimeters]
  caveat: Records planned and accomplished treatments reported by the Forest Service. Other agencies are not included.
- id: globalrx
  title: GlobalRx
  icon: lucide/globe
  summary: 204,517 georeferenced prescribed burn records from 16 countries, with weather and environmental context for each burn.
  provider: Hsu et al. (University of East Anglia and collaborators)
  coverage: 16 countries
  period: 1979 to 2023
  resolution: Burn records (points)
  format: [CSV, Shapefile]
  license: CC BY 4.0
  update: Static
  access: https://doi.org/10.5281/zenodo.13379462
  docs: https://doi.org/10.1038/s41597-025-04941-w
  tags: [Bulk download, CSV, Shapefile, CC BY 4.0, Static, Multi-country, Point or station, Prescribed fire]
  caveat: Coverage is uneven across countries because each source database differs in reporting.
- id: ca-rx-monitoring
  title: California Prescribed Fire Monitoring Program
  icon: lucide/clipboard-list
  summary: Plot-level forest structure, fuel load and recovery measurements before and after prescribed fire at 36 California sites.
  provider: CAL FIRE and UC Davis
  coverage: California
  period: 2019 to 2024
  resolution: Plots (972 plots)
  format: [CSV]
  license: CC0
  update: Static
  access: https://doi.org/10.5061/dryad.612jm64gw
  docs: https://doi.org/10.1038/s41597-025-06509-0
  tags: [California, Bulk download, CSV, CC0, Static, United States, Point or station, Prescribed fire]
  caveat: Check the Dryad record for current license terms.
