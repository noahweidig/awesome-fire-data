- id: goes-glm
  title: GOES Geostationary Lightning Mapper (GLM) on AWS
  icon: lucide/zap
  summary: Lightning flash, group and event detections over the Americas from GOES-R satellites.
  provider: NOAA and NASA
  coverage: Americas and adjacent oceans
  period: 2017 to present
  resolution: Flash-level detections
  format: [NetCDF]
  license: Public domain
  update: Continuous
  access: https://registry.opendata.aws/noaa-goes/
  docs: https://registry.opendata.aws/noaa-goes/
  tags: [Americas, Cloud bucket, NetCDF, Public domain, Near real time, Point or station, GOES, Lightning]
  related: [goes-fdc]
  caveat: Detection efficiency varies with flash energy and viewing angle.
- id: lis-otd
  title: LIS/OTD Gridded Lightning Climatology
  icon: lucide/cloud-lightning
  summary: Space-based lightning climatologies from the TRMM Lightning Imaging Sensor and the Optical Transient Detector.
  provider: NASA GHRC DAAC
  coverage: Global (about 38 degrees N to S for LIS)
  period: May 1995 to 2013 (V2.3.2015)
  resolution: 0.5 and 2.5 degrees
  format: [HDF, NetCDF]
  license: NASA open data
  update: Static
  access: https://ghrc.nsstc.nasa.gov/pub/lis/climatology/
  docs: https://ghrc.nsstc.nasa.gov/uso/ds_details/collections/loCv2.3.2015.html
  tags: [Global, Bulk download, HDF, NetCDF, NASA open data, Static, Grid over 5 km, Lightning]
  caveat: A climatology, not event-level data. Use GLM for recent individual strikes.
