- id: census-tiger
  title: US Census TIGER/Line Shapefiles
  icon: lucide/landmark
  summary: States, counties, tracts, block groups, places, roads and water boundaries for the US.
  provider: US Census Bureau
  coverage: United States and territories
  period: 2007 to present (annual)
  resolution: Vector
  format: [Shapefile]
  license: Public domain
  update: Annual
  access: https://www2.census.gov/geo/tiger/
  docs: https://www.census.gov/geographies/mapping-files/time-series/geo/tiger-line-file.html
  tags: [United States, Bulk download, Shapefile, Public domain, Annual, Vector, Boundaries]
  related: [cdc-svi, fema-nri]
  caveat: Boundaries change each year. Use the vintage that matches your attribute data.
